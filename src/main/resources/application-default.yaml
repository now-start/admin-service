server:
  port: 8761

spring:
  application:
    name: admin
  boot:
    admin:
      context-path: /monitor
  security:
    user:
      name: ${USER_NAME:admin}
      password: ${USER_PASSWORD:admin}

eureka:
  instance:
    metadata-map:
      user.name: ${spring.security.user.name}
      user.password: ${spring.security.user.password}